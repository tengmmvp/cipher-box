<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>密匣共享包解密器</title>
<style>
*{box-sizing:border-box}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Microsoft YaHei","Segoe UI",sans-serif;background:#fbfbfd;color:#1d1d1f;margin:0;padding:20px;line-height:1.5}
.container{max-width:720px;margin:0 auto}
h1{font-size:22px;margin:0}
.version{color:#86868b;font-size:12px;margin:4px 0 0}
.step{margin:16px 0;padding:16px;background:#fff;border-radius:8px;border:1px solid #d2d2d7}
.file-label{display:inline-block;padding:10px 20px;background:#0071e3;color:#fff;border-radius:980px;cursor:pointer;font-size:14px}
.file-label:hover{background:#0058b9}
#file-info{margin:8px 0 0;color:#6e6e73;font-size:14px}
#password{padding:8px 12px;border:1px solid #d2d2d7;border-radius:8px;width:60%;font-size:14px}
#password:focus{outline:none;border-color:#0071e3}
#decrypt-btn{padding:8px 20px;background:#0071e3;color:#fff;border:none;border-radius:980px;cursor:pointer;margin-left:8px;font-size:14px;font-weight:600}
#decrypt-btn:disabled{background:#c7c7cc;cursor:not-allowed}
.status{padding:8px 12px;border-radius:8px;margin:12px 0;font-size:14px}
.status.info{background:#e8f1fb;color:#0071e3}
.status.success{background:#e8f8ed;color:#248a3d}
.status.error{background:#ffe1e1;color:#d70015}
.warn{padding:10px;background:#fff4e0;color:#c93400;border-radius:8px;margin:8px 0;font-size:14px}
.notice{padding:10px;background:#e8f1fb;color:#0071e3;border-radius:8px;margin:8px 0;font-size:14px}
.count{color:#6e6e73;font-size:14px;margin:8px 0}
.entry{background:#fff;border-radius:8px;padding:16px;margin:12px 0;border:1px solid #d2d2d7}
.entry-title{font-size:17px;font-weight:600;margin-bottom:8px}
.badge{display:inline-block;padding:2px 8px;background:#e8f1fb;color:#0071e3;border-radius:980px;font-size:12px;margin-left:8px;vertical-align:middle}
.field{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:14px}
.field .label{color:#86868b;min-width:64px;flex-shrink:0}
.field .value{flex:1;word-break:break-all}
.field .value.secret{cursor:pointer;letter-spacing:2px;color:#0071e3}
.field pre.value{white-space:pre-wrap;margin:0;font-family:inherit}
.field a.value{color:#0071e3}
.copy{padding:2px 10px;background:#f5f5f7;border:1px solid #d2d2d7;border-radius:980px;cursor:pointer;font-size:12px;flex-shrink:0}
.copy:hover{background:#e5e5e7}
footer{margin-top:24px;color:#86868b;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="container">
  <h1>🔐 密匣共享包解密器</h1>
  <p class="version">格式版本 {{VERSION}} · 本地解密，无任何网络通信</p>

  <div class="step">
    <label class="file-label">
      <input type="file" id="file-input" accept=".cboxshare" hidden>
      <span>选择 .cboxshare 文件</span>
    </label>
    <p id="file-info"></p>
  </div>

  <div id="step-password" class="step" hidden>
    <input type="password" id="password" placeholder="输入共享密码" autocomplete="off">
    <button id="decrypt-btn">解密</button>
  </div>

  <div id="status" class="status" hidden></div>
  <div id="entries"></div>

  <footer>
    <p>所有解密在本机浏览器完成，密码与明文均不离开本机。</p>
  </footer>
</div>

<script>{{HASH_WASM_JS}}</script>
<script>{{ASMCRYPTO_JS}}</script>
<script>
(function () {
  "use strict";

  // 头部布局常量（须与 Python share.header_codec 保持一致）。
  var MAGIC = "CipherBoxShare\u0000";   // 15 字节：14 字符 + NUL
  var MAGIC_LEN = 15;
  var STRUCT_SIZE = 29;                  // B + I + I + I + Q + Q
  var SALT_SIZE = 32;
  var HEADER_SIZE = MAGIC_LEN + STRUCT_SIZE + SALT_SIZE;  // 76
  var CB2_LEN = 3;                       // encrypt_bytes 的 "CB2" 前缀
  var NONCE_SIZE = 12;
  var KEY_SIZE = 32;
  var SHARE_AAD = "CipherBox:share";  // GCM-AAD 域前缀，须与 Python share.header_codec.SHARE_AAD 一致
  var HKDF_INFO = "cipherbox:share-key";

  var fileBytes = null;
  var header = null;

  var fileInput = document.getElementById("file-input");
  var fileInfo = document.getElementById("file-info");
  var stepPwd = document.getElementById("step-password");
  var pwdInput = document.getElementById("password");
  var decryptBtn = document.getElementById("decrypt-btn");
  var statusEl = document.getElementById("status");
  var entriesEl = document.getElementById("entries");

  fileInput.addEventListener("change", onFileChange);
  decryptBtn.addEventListener("click", onDecrypt);
  pwdInput.addEventListener("keydown", function (e) { if (e.key === "Enter") onDecrypt(); });
  entriesEl.addEventListener("click", onEntriesClick);

  function showStatus(msg, kind) {
    statusEl.hidden = !msg;
    statusEl.textContent = msg || "";
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function showError(msg) {
    showStatus(msg, "error");
    entriesEl.innerHTML = "";
  }

  function onFileChange(e) {
    var file = e.target.files[0];
    if (!file) return;
    showStatus("正在读取文件…", "info");
    file.arrayBuffer().then(function (buf) {
      fileBytes = new Uint8Array(buf);
      try {
        header = parseHeader(fileBytes);
      } catch (err) {
        header = null;
        showError("文件格式无效：" + err.message);
        return;
      }
      fileInfo.textContent = "已加载：" + file.name;
      stepPwd.hidden = false;
      pwdInput.focus();
      showStatus("请输入共享密码后点击「解密」", "info");
    });
  }

  function parseHeader(bytes) {
    if (bytes.length < HEADER_SIZE + CB2_LEN + NONCE_SIZE + 16) {
      throw new Error("文件过短");
    }
    var magicStr = new TextDecoder("utf-8").decode(bytes.subarray(0, MAGIC_LEN));
    if (magicStr !== MAGIC) throw new Error("非密匣共享包");
    var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var version = dv.getUint8(MAGIC_LEN);
    if (version !== {{VERSION}}) throw new Error("不支持的版本 " + version);
    var time = dv.getUint32(MAGIC_LEN + 1, true);
    var mem = dv.getUint32(MAGIC_LEN + 5, true);
    var parallel = dv.getUint32(MAGIC_LEN + 9, true);
    var expire = Number(dv.getBigUint64(MAGIC_LEN + 13, true));
    var created = Number(dv.getBigUint64(MAGIC_LEN + 21, true));
    // slice 复制为独立缓冲，避免 byteOffset!=0 时下游库误读。
    var salt = bytes.slice(HEADER_SIZE - SALT_SIZE, HEADER_SIZE);
    var ctBlock = bytes.subarray(HEADER_SIZE);
    var cb2 = new TextDecoder("ascii").decode(ctBlock.subarray(0, CB2_LEN));
    if (cb2 !== "CB2") throw new Error("密文格式损坏");
    var nonce = bytes.slice(HEADER_SIZE + CB2_LEN, HEADER_SIZE + CB2_LEN + NONCE_SIZE);
    var ctWithTag = bytes.slice(HEADER_SIZE + CB2_LEN + NONCE_SIZE);
    return {
      time: time, mem: mem, parallel: parallel, expire: expire, created: created,
      salt: salt, nonce: nonce, ctWithTag: ctWithTag,
      headerBytes: bytes.slice(0, HEADER_SIZE),
    };
  }

  function onDecrypt() {
    if (!header) return;
    var pwd = pwdInput.value;
    if (!pwd) { showStatus("请输入密码", "error"); return; }
    decryptBtn.disabled = true;
    showStatus("正在派生密钥（Argon2id，约 1-2 秒）…", "info");
    // 让状态先渲染再进入耗时的派生。
    setTimeout(function () { doDecrypt(pwd); }, 30);
  }

  async function doDecrypt(pwd) {
    try {
      // KDF 参数上下界（镜像 Python MAX_SHARE_KDF_MULTIPLIER=2 与 DEFAULT_KDF_PARAMS
      // t3/m64MiB/p4）：拒绝恶意构造的极大参数（浏览器 OOM/长时间冻结）与降级参数，
      // 在投入 Argon2id 派生前即返回，避免内存/算力耗尽 DoS。
      var D = { time: 3, mem: 64 * 1024, parallel: 4 };
      if (header.time < D.time || header.mem < D.mem || header.parallel < D.parallel ||
          header.time > D.time * 2 || header.mem > D.mem * 2 || header.parallel > D.parallel * 2) {
        showError("共享包 KDF 参数异常，可能已被篡改");
        return;
      }
      var pwBytes = new TextEncoder().encode(pwd.normalize("NFC"));
      var prk = await hashwasm.argon2id({
        password: pwBytes,
        salt: header.salt,
        parallelism: header.parallel,
        memorySize: header.mem,
        iterations: header.time,
        hashLength: 32,
        outputType: "binary",
      });
      var aesKey = hkdfExpand(prk, HKDF_INFO, KEY_SIZE);
      var aad = buildAad(header.headerBytes);
      var pt = asmCrypto.AES_GCM.decrypt(header.ctWithTag, aesKey, header.nonce, aad);
      var json = new TextDecoder("utf-8").decode(pt);
      var data = JSON.parse(json);
      renderEntries(data, header);
      showStatus("解密成功", "success");
    } catch (err) {
      showError("解密失败：密码错误或文件已损坏");
    } finally {
      decryptBtn.disabled = false;
    }
  }

  // HKDF-Expand（RFC 5869）：length=32 时单轮 T(1)=HMAC(PRK, info||0x01)。
  function hkdfExpand(prk, info, length) {
    var infoBytes = new TextEncoder().encode(info);
    var data = new Uint8Array(infoBytes.length + 1);
    data.set(infoBytes, 0);
    data[infoBytes.length] = 1;
    var h = new asmCrypto.HmacSha256(prk);
    h.process(data);
    var t = new Uint8Array(h.finish().result);
    return t.slice(0, length);
  }

  function buildAad(headerBytes) {
    var prefix = new TextEncoder().encode(SHARE_AAD);
    var aad = new Uint8Array(prefix.length + headerBytes.length);
    aad.set(prefix, 0);
    aad.set(headerBytes, prefix.length);
    return aad;
  }

  function renderEntries(data, hdr) {
    var html = "";
    if (hdr.expire > 0) {
      var now = Math.floor(Date.now() / 1000);
      if (hdr.expire < now) {
        html += '<div class="warn">⚠ 此共享包已超过有效期（软限制，仍可查看）</div>';
      } else {
        var hours = Math.ceil((hdr.expire - now) / 3600);
        html += '<div class="notice">此共享包将在约 ' + hours + ' 小时后过期</div>';
      }
    }
    var entries = (data && data.entries) || [];
    html += '<p class="count">共 ' + entries.length + ' 个条目</p>';
    entries.forEach(function (e) { html += renderEntry(e); });
    entriesEl.innerHTML = html;
    bindCopyButtons();
  }

  function renderEntry(e) {
    var h = '<div class="entry"><div class="entry-title">' + esc(e.title || "(无标题)") + "";
    if (e.entry_type) h += '<span class="badge">' + esc(e.entry_type) + "</span>";
    h += "</div>";
    h += field("账号", e.username, false);
    if ("password" in e) h += field("密码", e.password, true);
    if (e.url) h += field("网址", e.url, false, e.url);
    if ("totp_secret" in e && e.totp_secret) h += field("TOTP", e.totp_secret, true);
    if (e.tags) h += field("标签", e.tags, false);
    if (e.notes) h += '<div class="field"><span class="label">备注</span><pre class="value">' + esc(e.notes) + "</pre></div>";
    if (Array.isArray(e.custom_fields) && e.custom_fields.length) {
      e.custom_fields.forEach(function (cf) {
        h += field(cf.name, cf.value, cf.field_type === "password");
      });
    }
    h += "</div>";
    return h;
  }

  function field(label, value, secret, url) {
    if (!value) return "";
    var h = '<div class="field"><span class="label">' + esc(label) + "</span>";
    if (secret) {
      h += '<span class="value secret" data-reveal="' + esc(value) + '">●●●●●●</span>';
    } else if (url && /^https?:/i.test(url)) {
      // 仅 http(s) 渲染为可点击链接；拦截 javascript:/data:/file: 等危险 scheme，避免链接单击触发脚本执行（与主 App detail_panel._build_url_label 一致）。
      h += '<a class="value" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(value) + "</a>";
    } else {
      h += '<span class="value">' + esc(value) + "</span>";
    }
    h += '<button class="copy" data-copy="' + esc(value) + '">复制</button></div>';
    return h;
  }

  function bindCopyButtons() {
    entriesEl.querySelectorAll("[data-copy]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        copyText(btn.getAttribute("data-copy"));
        var old = btn.textContent;
        btn.textContent = "已复制";
        setTimeout(function () { btn.textContent = old; }, 1000);
      });
    });
  }

  function onEntriesClick(e) {
    if (e.target.classList.contains("secret")) {
      var v = e.target.getAttribute("data-reveal");
      e.target.textContent = e.target.textContent === "●●●●●●" ? v : "●●●●●●";
    }
  }

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text);
      return;
    }
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }
})();
</script>
</body>
</html>
