# 本地质量门禁：ruff（lint + format）与 mypy，统一经 `uv run` 复用 uv.lock 锁定的
# 工具版本，与 CI 完全同源（单一事实源 = uv.lock），从结构上消除版本/依赖双源漂移。
# 启用：pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        # 仅在 src 变更时触发；pass_filenames:false 使 mypy 整包检查而非仅暂存文件，
        # 避免单文件检查因缺导入上下文误报。运行时依赖（PyQt6 等）由 uv 环境提供。
        files: ^src/
        types_or: [python]
        pass_filenames: false
        args: [--config-file=pyproject.toml, src]
