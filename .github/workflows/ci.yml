name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 三平台 × Python 支持区间（3.12 最低 / 3.13 最高）边界覆盖
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # CI 无显示器：用 Qt offscreen 平台插件，避免 PyQt6 因找不到显示后端初始化失败
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libdbus-1-3 libxkbcommon0 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0 libxcb-xinerama0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra dev
      # lint / 类型检查与 pip-audit 仅在最高档 3.13 跑一次，避免在 3.12 重复
      - name: Ruff check
        if: matrix.python-version == '3.13'
        run: uv run -m ruff check src tests
      - name: Ruff format check
        if: matrix.python-version == '3.13'
        run: uv run -m ruff format --check src tests
      # 审计编号索引与代码一致性（处数/分区项数/下一可用号/缺登检测）：
      # 纯 stdlib、pathlib 路径，三平台矩阵均可在 3.13 档跑一次即可
      - name: Audit codes index check
        if: matrix.python-version == '3.13'
        run: uv run python scripts/verify_audit_codes.py
      # ruff/pytest/mypy/pyright/coverage 统一 -m 形式（MAINT-041）：.venv\Scripts 下的
      # trampoline 入口（*.exe）在部分 uv/Windows 组合下报 Failed to canonicalize
      # script path，`-m` / `python -m` 语义等价且本地与 CI 行为一致（pyright 为
      # node 包装器，无顶层 Python 模块语义差异，经 python -m 调用其 __main__ 包装；
      # pip-audit 经 --with 临时环境的脚本入口实测不受影响，保持原形式）。
      - name: Mypy
        if: matrix.python-version == '3.13'
        run: uv run -m mypy src
      - name: Pyright
        if: matrix.python-version == '3.13'
        run: uv run python -m pyright
      - name: Tests with coverage
        run: uv run -m pytest --cov=src --cov-branch --cov-report=term-missing --cov-report=xml
      # 分层覆盖率门槛（分支覆盖，MAINT-008）：开启 --cov-branch 后分支率严格 ≤ 行率，
      # 门槛务实下调。复用同一 .coverage，按 --omit/--include 路径切片。
      - name: Non-UI coverage gate
        run: uv run -m coverage report --omit="*/src/ui/*" --fail-under=82
      - name: UI coverage gate
        run: uv run -m coverage report --include="*/src/ui/*" --fail-under=65
      # pip-audit 经 --with 临时运行，不入 uv.lock
      - name: Dependency vulnerability scan
        if: matrix.python-version == '3.13'
        run: uv run --with pip-audit pip-audit
