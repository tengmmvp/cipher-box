name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 三平台 × Python 支持区间（3.10 最低 / 3.13 最高）边界 + 中间档 3.12 覆盖
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # CI 无显示器：用 Qt offscreen 平台插件，避免 PyQt6 因找不到显示后端初始化失败
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libdbus-1-3 libxkbcommon0 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0 libxcb-xinerama0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra dev
      # lint / 类型检查与 pip-audit 仅在最高档 3.13 跑一次，避免在 3.10/3.12 重复
      - name: Ruff check
        if: matrix.python-version == '3.13'
        run: uv run ruff check src tests
      - name: Ruff format check
        if: matrix.python-version == '3.13'
        run: uv run ruff format --check src tests
      - name: Mypy
        if: matrix.python-version == '3.13'
        run: uv run mypy src
      - name: Pyright
        if: matrix.python-version == '3.13'
        run: uv run pyright
      - name: Tests with coverage
        run: uv run pytest --cov=src --cov-branch --cov-report=term-missing --cov-report=xml
      # 分层覆盖率门槛（分支覆盖，MAINT-010）：开启 --cov-branch 后分支率严格 ≤ 行率，
      # 门槛务实下调。复用同一 .coverage，按 --omit/--include 路径切片。
      - name: Non-UI coverage gate
        run: uv run coverage report --omit="*/src/ui/*" --fail-under=73
      - name: UI coverage gate
        run: uv run coverage report --include="*/src/ui/*" --fail-under=18
      # pip-audit 经 --with 临时运行，不入 uv.lock
      - name: Dependency vulnerability scan
        if: matrix.python-version == '3.13'
        run: uv run --with pip-audit pip-audit
