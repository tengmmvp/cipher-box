name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libdbus-1-3 libxkbcommon0 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0 libxcb-xinerama0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # --locked 校验 uv.lock 与 pyproject.toml 完全一致，不一致即失败，
      # 强制依赖变更时同步更新 uv.lock，消除 lockfile 与声明漂移。
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml
      # 分层覆盖率门槛：非 UI 层（crypto/business/database/utils/config/models 等）85%，
      # UI 层 30%。一次 pytest 生成 .coverage，再用 coverage report 按 include/omit
      # 分层校验，避免非 UI 回退且不卡 UI 迭代。
      - run: uv run coverage report --omit="*/src/ui/*" --fail-under=85
      - run: uv run coverage report --include="*/src/ui/*" --fail-under=30
