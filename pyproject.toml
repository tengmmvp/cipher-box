[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cipher-box"
dynamic = ["version"]
description = "Local-first encrypted password manager built with PyQt6"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "PyQt6>=6.6.0,<6.10",
  "cryptography>=48.0.1,<50",
  "argon2-cffi>=25.1.0,<27",
  "QtAwesome>=1.3.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyright>=1.1.390",
  "ruff>=0.6",
]

[project.scripts]
cipherbox = "src.app:main"

[tool.setuptools.packages.find]
include = ["src*"]

# 限时加密共享包解密器资源（argon2.wasm + decrypter_template.html）随包分发。
# packages.find 仅收集 .py 模块，非 Python 资源须显式声明，否则 importlib.resources
# 在安装/打包后读不到（开发期源码树可读是巧合，sdist/wheel 会遗漏）。
[tool.setuptools.package-data]
"src.business.services.share_resources" = ["*"]

[tool.setuptools.dynamic]
# 版本号单一源：从 src.__version__ 读取，消除 pyproject 与 src/__init__.py 双源漂移。
version = {attr = "src.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# 分层覆盖率门槛（非 UI 73% / UI 18%，分支覆盖）在 CI 工作流经命令行 `--fail-under`
# 分别定义（pyproject 的单一 fail_under 无法表达分层语义，设全局值会因 UI 拉低全量
# 而误伤）。本地验证用 CI 等价命令：
#   uv run coverage report --branch --omit="*/src/ui/*" --fail-under=73
#   uv run coverage report --branch --include="*/src/ui/*" --fail-under=18
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# 选中规则的意图分组：
# E9/F63/F7/F82：ruff 默认强制的真错误（语法错误、无效 assert、控制流错位、未定义名字）
# F401：未用导入（UP045 把 Optional[X] 改为 X|None 后，自动清理残留 Optional 导入）
# F811：重复定义；W292：文件末尾换行；I：import 排序
# UP：pyupgrade，推动 PEP 604（X | None）、内置泛型等现代化语法（多可自动修复）
# B：flake8-bugbear，捕获可变默认参数、裸 except、assert 用于运行期校验等真问题
select = ["E9", "F401", "F63", "F7", "F82", "F811", "W292", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Qt Model 子类的 rowCount/columnCount/index 等重写方法以 QModelIndex() 作默认
# 参数是 PyQt6 官方推荐签名，B008（默认参数函数调用）对此误报，整文件豁免。
"src/ui/components/entry_list_widget.py" = ["B008"]

[tool.ruff.lint.isort]
# 合并 as 重命名 import 到主块，匹配项目既有的单块 import 风格，避免同一模块
# 被 isort 拆成多个 import 块（如 `from x import a` 与 `from x import b as _b`
# 分离）。这是放宽配置：原本单块即合规的文件不受影响。
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
# 收紧类型检查：要求显式标注，禁止隐式 Optional 与返回 Any
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true

# PyQt6 的 QAbstractNativeEventFilter.nativeEventFilter 类型存根与运行时签名不一致
#（存根返回 tuple[bool, voidptr|None]，运行时需 tuple[bool, int]），且 ruff format 将
# 多行签名的 type:ignore 拆离错误所在行。对该模块禁用 override 检查（模块内仅此一处
# override），pyright 侧经行内 pyright:ignore 抑制。
[[tool.mypy.overrides]]
module = "src.ui.controllers.auto_lock_controller"
disable_error_code = ["override"]

[tool.pyright]
# 只检查 src（生产代码），与 mypy（mypy src）对齐。tests 由 pytest 守护；测试中 Mock
# 属性（assert_not_called/side_effect）、Optional 成员访问、私有属性访问等模式与 pyright
# 严格模式摩擦多，不纳入 pyright 门禁，避免为测试代码铺满 type: ignore。
include = ["src"]
# 指向项目 venv 解析 PyQt6 等第三方依赖；pyright CLI 默认不用 .venv，会误报
# reportMissingImports（PyQt6 未解析），并连带触发 reportOptionalMemberAccess。
venvPath = "."
venv = ".venv"
# 密钥以 bytearray 持有以便 secure_zero_buffer 真正清零；bytearray 是 bytes-like，
# 启用类型提升以避免在加密/哈希调用处产生大量 bytes|bytearray 注解噪音。
disableBytesTypePromotions = false
# 未用局部变量（``_`` 前缀为 Python「故意未用」惯例）不作诊断项；pyright 本就不
# 检查未用参数（参数用于接口/信号槽签名匹配），未用变量由代码审查把关。
reportUnusedVariable = "none"
