[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cipher-box"
version = "1.0.0"
description = "Local-first encrypted password manager built with PyQt6"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "PyQt6>=6.6.0",
  "cryptography>=42.0.0",
  "argon2-cffi>=25.1.0",
  "QtAwesome>=1.3.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
cipherbox = "src.app:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F811", "W292", "I"]

[tool.ruff.lint.isort]
# 合并 as 重命名 import 到主块，匹配项目既有的单块 import 风格，避免同一模块
# 被 isort 拆成多个 import 块（如 `from x import a` 与 `from x import b as _b`
# 分离）。这是放宽配置：原本单块即合规的文件不受影响。
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pyright]
# 密钥以 bytearray 持有以便 secure_zero_buffer 真正清零；bytearray 是 bytes-like，
# 启用类型提升以避免在加密/哈希调用处产生大量 bytes|bytearray 注解噪音。
disableBytesTypePromotions = false
