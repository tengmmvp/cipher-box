[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cipher-box"
version = "1.0.0"
description = "Local-first encrypted password manager built with PyQt6"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "PyQt6>=6.6.0",
  "cryptography>=42.0.0",
  "QtAwesome>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cipherbox = "src.app:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
